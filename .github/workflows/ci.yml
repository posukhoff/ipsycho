name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The image now builds the Mini App bundle as well as the server.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

      # The Caddyfile is the only publicly reachable configuration in the repository: a syntax
      # error there is an outage, and a stray catch-all route publishes /health and /ready. The
      # domain is supplied by the environment in production, so adapt against a placeholder.
      - name: Validate the Caddyfile
        run: |
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e WEBAPP_DOMAIN=ci.example \
            -e ACME_EMAIL=ci@ci.example \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ipsycho:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ipsycho_e2e
          POSTGRES_USER: ipsycho_e2e
          POSTGRES_PASSWORD: ipsycho_e2e_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ipsycho_e2e -d ipsycho_e2e"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://ipsycho_e2e:ipsycho_e2e_only@127.0.0.1:5433/ipsycho_e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run test:e2e

      # A backup that has never been restored is not a backup: dump, encrypt, decrypt, restore,
      # compare row counts per table.
      - name: Backup round trip
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: ./scripts/backup-roundtrip.sh
