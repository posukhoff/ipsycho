services:
  postgres-e2e:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ipsycho_e2e
      POSTGRES_USER: ipsycho_e2e
      POSTGRES_PASSWORD: ipsycho_e2e_only
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipsycho_e2e -d ipsycho_e2e"]
      interval: 2s
      timeout: 2s
      retries: 20
