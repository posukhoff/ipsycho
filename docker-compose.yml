services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_DB: ipsycho
      POSTGRES_USER: ipsycho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipsycho -d ipsycho"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build:
      context: .
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
    restart: unless-stopped
    logging: *logging
    # The old container must release the advisory lock before the new one migrates; the runner
    # stops polling and drains in-flight updates within this window.
    stop_grace_period: 30s
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://ipsycho:${POSTGRES_PASSWORD}@postgres:5432/ipsycho
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # No published app port: /health and /ready remain internal to Docker/VPS.

volumes:
  postgres_data:
