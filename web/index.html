<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` plus `user-scalable=no`: a Mini App is a fixed webview, and a pinch-zoom
      inside it reads as a broken native screen rather than a web page.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>IPsycho</title>
    <!--
      The Telegram bootstrap. It is the one script served from a third origin, which is why the CSP
      in the Caddyfile allows `script-src 'self' https://telegram.org` and nothing else — and why it
      must stay free of 'unsafe-inline': the API is same-origin with no cookie, so an XSS here is
      full account control.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js?58"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
